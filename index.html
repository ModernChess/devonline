<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modern Chess Online - DevOnline</title>
    <style>
        :root {
            --bg-color: #121212;
            --surface-color: #1e1e1e;
            --surface-alt: #161616;
            --border-color: #333;
            --primary: #4CAF50;
            --secondary: #2196F3;
            --danger: #ff5252;
            --text-color: #ffffff;
            --text-muted: #888;
        }

        body {
            margin: 0;
            padding: 15px;
            background: var(--bg-color);
            color: var(--text-color);
            font-family: sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            min-height: 100vh;
            box-sizing: border-box;
        }

        .version-badge {
            position: fixed;
            top: 15px;
            right: 15px;
            background: #ff9800;
            color: #121212;
            font-size: 0.75rem;
            font-weight: bold;
            padding: 5px 10px;
            border-radius: 20px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.4);
            z-index: 1000;
        }

        /* Screen containers */
        .screen {
            display: none;
            width: 100%;
            max-width: 400px;
            flex-direction: column;
            align-items: center;
        }

        .screen.active {
            display: flex;
        }

        /* Card Container */
        .card {
            background: var(--surface-color);
            padding: 25px;
            border-radius: 15px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.5);
            width: 100%;
            box-sizing: border-box;
            text-align: center;
            margin-bottom: 15px;
        }

        h2 { margin-top: 0; font-size: 1.3rem; margin-bottom: 15px; }

        .input-group {
            margin-bottom: 15px;
            text-align: left;
        }

        .input-group label {
            display: block;
            font-size: 0.8rem;
            color: var(--text-muted);
            margin-bottom: 5px;
        }

        .input-group input {
            width: 100%;
            padding: 10px;
            border-radius: 8px;
            border: 1px solid var(--border-color);
            background: #2a2a2a;
            color: #fff;
            box-sizing: border-box;
            font-size: 1rem;
            outline: none;
        }

        .btn {
            width: 100%;
            padding: 10px;
            background: var(--primary);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            margin-top: 5px;
        }

        .btn-secondary {
            background: var(--secondary);
        }

        .btn-danger {
            background: var(--danger);
        }

        .error-msg {
            color: var(--danger);
            font-size: 0.8rem;
            margin-top: 10px;
            min-height: 15px;
        }

        /* Placeholder Accounts Box */
        .accounts-box {
            background: var(--surface-alt);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            max-height: 120px;
            overflow-y: auto;
            margin-bottom: 15px;
            text-align: left;
            padding: 8px;
        }

        .accounts-title {
            font-size: 0.75rem;
            color: var(--text-muted);
            margin-bottom: 5px;
            text-transform: uppercase;
        }

        .account-item {
            font-size: 0.8rem;
            color: #b0bec5;
            padding: 2px 4px;
        }

        /* Server Lobby */
        .server-list {
            background: var(--surface-alt);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            height: 180px;
            overflow-y: auto;
            margin-bottom: 15px;
            width: 100%;
            box-sizing: border-box;
            padding: 8px;
            text-align: left;
        }

        .server-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #222;
            padding: 8px 10px;
            border-radius: 6px;
            margin-bottom: 8px;
            font-size: 0.85rem;
        }

        .server-item button {
            padding: 4px 10px;
            font-size: 0.75rem;
            width: auto;
            margin: 0;
        }

        /* Game Board & HUD */
        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 100%;
            margin-bottom: 10px;
        }

        #canvas-container {
            position: relative;
            width: 320px;
            height: 320px;
            background: #222;
            border: 2px solid var(--border-color);
            border-radius: 8px;
            overflow: hidden;
            margin-bottom: 15px;
        }

        canvas {
            display: block;
            background: #181818;
        }

        .status-banner {
            background: var(--surface-color);
            padding: 8px 12px;
            border-radius: 6px;
            font-size: 0.85rem;
            margin-bottom: 15px;
            width: 100%;
            box-sizing: border-box;
            text-align: center;
            font-weight: bold;
            color: #ffeb3b;
        }

        /* Chat Widget */
        .chat-widget {
            width: 100%;
            background: var(--surface-color);
            border-radius: 10px;
            overflow: hidden;
            margin-bottom: 15px;
            box-sizing: border-box;
        }

        .chat-header {
            background: #252525;
            padding: 8px 12px;
            font-size: 0.85rem;
            font-weight: bold;
            color: var(--secondary);
            cursor: pointer;
            display: flex;
            justify-content: space-between;
        }

        .chat-body {
            max-height: 120px;
            overflow-y: auto;
            padding: 8px;
            display: flex;
            flex-direction: column;
            gap: 4px;
            background: var(--surface-alt);
        }

        .chat-msg {
            font-size: 0.8rem;
            background: #222;
            padding: 4px 8px;
            border-radius: 4px;
            word-break: break-word;
        }

        .chat-input-area {
            display: flex;
            border-top: 1px solid var(--border-color);
            padding: 6px;
            background: var(--surface-color);
            gap: 6px;
        }

        .chat-input-area input {
            flex: 1;
            background: #2a2a2a;
            border: 1px solid var(--border-color);
            border-radius: 4px;
            padding: 4px 8px;
            color: #fff;
            font-size: 0.8rem;
            outline: none;
        }

        .chat-input-area button {
            padding: 4px 10px;
            font-size: 0.8rem;
            width: auto;
            margin: 0;
        }
    </style>
</head>
<body>

    <div class="version-badge">devonline v1.0</div>

    <!-- 1. LOGIN SCREEN -->
    <div id="login-screen" class="screen active">
        <div class="card">
            <h2>Modern Chess Login</h2>
            <div class="accounts-box">
                <div class="accounts-title">Preset Accounts (Pass: 123)</div>
                <div class="account-item">player1 - player10</div>
            </div>
            <div class="input-group">
                <label>Username</label>
                <input type="text" id="userInput" placeholder="e.g. player1">
            </div>
            <div class="input-group">
                <label>Password</label>
                <input type="password" id="passInput" placeholder="e.g. 123">
            </div>
            <button class="btn" id="loginBtn">Login</button>
            <div class="error-msg" id="loginError"></div>
        </div>
    </div>

    <!-- 2. LOBBY SCREEN -->
    <div id="lobby-screen" class="screen">
        <div class="card">
            <div class="top-bar">
                <span id="welcomeUser" style="font-weight:bold; color:var(--primary);"></span>
                <button class="btn btn-danger" id="logoutBtn" style="width:auto; padding:4px 8px; font-size:0.75rem; margin:0;">Logout</button>
            </div>
            <h2>Server Lobby</h2>
            <button class="btn" id="createServerBtn">Create New Server</button>
            <div style="margin: 10px 0 5px 0; font-size:0.75rem; color:var(--text-muted); text-align:left;">Available Servers:</div>
            <div class="server-list" id="serverList">
                <div style="color:var(--text-muted); font-size:0.8rem; text-align:center; margin-top:20px;">No servers active. Create one!</div>
            </div>
        </div>
    </div>

    <!-- 3. WAITING ROOM SCREEN -->
    <div id="wait-screen" class="screen">
        <div class="card">
            <h2>Waiting for Opponent...</h2>
            <p style="font-size:0.85rem; color:var(--text-muted);">You created this server. Waiting for 1 more player to join as Red Team.</p>
            <div id="roomCodeDisplay" style="font-size:0.8rem; color:#ffeb3b; margin-bottom:15px;"></div>
            <button class="btn btn-danger" id="cancelRoomBtn">Cancel & Leave</button>
        </div>
    </div>

    <!-- 4. GAME SCREEN -->
    <div id="game-screen" class="screen">
        <div class="top-bar">
            <span id="playerTeamBadge" style="font-weight:bold; font-size:0.85rem;"></span>
            <button class="btn btn-danger" id="surrenderBtn" style="width:auto; padding:4px 8px; font-size:0.75rem; margin:0;">Leave Game</button>
        </div>
        
        <div class="status-banner" id="statusBanner">Connecting to match...</div>

        <div id="canvas-container">
            <canvas id="gameCanvas" width="320" height="320"></canvas>
        </div>

        <div class="chat-widget">
            <div class="chat-header" id="chatToggle">
                <span>Match Chat</span>
                <span>▲</span>
            </div>
            <div class="chat-body" id="chatMessages"></div>
            <div class="chat-input-area">
                <input type="text" id="chatInput" placeholder="Say something...">
                <button class="btn btn-secondary" id="chatSend">Send</button>
            </div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getDatabase, ref, set, onValue, push, remove, update, get } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

        const firebaseConfig = {
            databaseURL: "https://mchess12333-default-rtdb.asia-southeast1.firebasedatabase.app/"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        // 10 Preset Accounts
        const validUsers = {};
        for(let i=1; i<=10; i++) {
            validUsers[`player${i}`] = "123";
        }

        // App State Variables
        let currentUser = localStorage.getItem('devOnlineUser') || null;
        let currentServerId = null;
        let myTeam = null; // 'blue' or 'red'
        let unsubscribeMatch = null;

        // UI Elements
        const screens = {
            login: document.getElementById('login-screen'),
            lobby: document.getElementById('lobby-screen'),
            wait: document.getElementById('wait-screen'),
            game: document.getElementById('game-screen')
        };

        function switchScreen(name) {
            Object.values(screens.login.parentNode.children).forEach(el => {
                if(el.classList && el.classList.contains('screen')) el.classList.remove('active');
            });
            screens[name].classList.add('active');
        }

        // Login Logic
        document.getElementById('loginBtn').addEventListener('click', () => {
            const u = document.getElementById('userInput').value.trim();
            const p = document.getElementById('passInput').value.trim();
            const err = document.getElementById('loginError');

            if(validUsers[u] && validUsers[u] === p) {
                currentUser = u;
                localStorage.setItem('devOnlineUser', u);
                err.textContent = '';
                initLobby();
            } else {
                err.textContent = "Invalid account credentials!";
            }
        });

        document.getElementById('logoutBtn').addEventListener('click', () => {
            localStorage.removeItem('devOnlineUser');
            currentUser = null;
            switchScreen('login');
        });

        if(currentUser) {
            initLobby();
        }

        function initLobby() {
            document.getElementById('welcomeUser').textContent = `User: ${currentUser}`;
            switchScreen('lobby');

            const serversRef = ref(db, 'servers');
            onValue(serversRef, (snapshot) => {
                const data = snapshot.val();
                const listEl = document.getElementById('serverList');
                listEl.innerHTML = '';

                if(!data) {
                    listEl.innerHTML = '<div style="color:var(--text-muted); font-size:0.8rem; text-align:center; margin-top:20px;">No servers active. Create one!</div>';
                    return;
                }

                Object.keys(data).forEach(srvId => {
                    const srv = data[srvId];
                    if(srv.status === 'waiting') {
                        const item = document.createElement('div');
                        item.className = 'server-item';
                        item.innerHTML = `<span>Host: <b>${srv.host}</b></span>`;
                        
                        const joinBtn = document.createElement('button');
                        joinBtn.className = 'btn';
                        joinBtn.textContent = 'Join Match';
                        joinBtn.onclick = () => joinServer(srvId);
                        
                        item.appendChild(joinBtn);
                        listEl.appendChild(item);
                    }
                });
            });
        }

        // Create Server
        document.getElementById('createServerBtn').addEventListener('click', () => {
            const newSrvRef = push(ref(db, 'servers'));
            currentServerId = newSrvRef.key;
            myTeam = 'blue';

            // Initial 8x8 Board Preset Units
            // Grid is 8x8. Cell size 40px (Canvas 320x320).
            // Blue units at bottom (row 7): [0: Tank, 2: Infantry, 5: Infantry]
            // Red units at top (row 0): [2: Infantry, 5: Infantry, 7: Tank]
            const initialUnits = [
                { id: 'b1', team: 'blue', type: 'tank', x: 1, y: 7 },
                { id: 'b2', team: 'blue', type: 'infantry', x: 3, y: 7 },
                { id: 'b3', team: 'blue', type: 'infantry', x: 6, y: 7 },
                { id: 'r1', team: 'red', type: 'infantry', x: 1, y: 0 },
                { id: 'r2', team: 'red', type: 'infantry', x: 4, y: 0 },
                { id: 'r3', team: 'red', type: 'tank', x: 6, y: 0 }
            ];

            set(newSrvRef, {
                host: currentUser,
                guest: null,
                status: 'waiting',
                turn: 'blue',
                units: initialUnits
            }).then(() => {
                document.getElementById('roomCodeDisplay').textContent = `Server ID: ${currentServerId}`;
                switchScreen('wait');
                listenToMatchState();
            });
        });

        document.getElementById('cancelRoomBtn').addEventListener('click', () => {
            if(currentServerId) {
                remove(ref(db, `servers/${currentServerId}`));
                currentServerId = null;
            }
            switchScreen('lobby');
        });

        function joinServer(srvId) {
            currentServerId = srvId;
            myTeam = 'red';

            update(ref(db, `servers/${srvId}`), {
                guest: currentUser,
                status: 'playing'
            }).then(() => {
                switchScreen('game');
                startCanvasGame();
            });
        }

        function listenToMatchState() {
            const srvRef = ref(db, `servers/${currentServerId}`);
            onValue(srvRef, (snapshot) => {
                const srv = snapshot.val();
                if(srv && srv.status === 'playing') {
                    switchScreen('game');
                    startCanvasGame();
                }
            });
        }

        // Canvas Game Logic (8x8 Grid, Tanks & Infantry, Superunits, Combat)
        function startCanvasGame() {
            const canvas = document.getElementById('gameCanvas');
            const ctx = canvas.getContext('2d');
            const tileSize = 40; // 320 / 8
            let selectedUnit = null;

            const srvRef = ref(db, `servers/${currentServerId}`);
            
            onValue(srvRef, (snapshot) => {
                const match = snapshot.val();
                if(!match) return;

                if(match.status === 'ended') {
                    alert("Match ended!");
                    switchScreen('lobby');
                    return;
                }

                renderBoard(match);
            });

            function renderBoard(match) {
                ctx.clearRect(0, 0, 320, 320);

                // Draw 8x8 Grid lines & checkerboard
                for(let r=0; r<8; r++) {
                    for(let c=0; c<8; c++) {
                        ctx.fillStyle = (r + c) % 2 === 0 ? '#1e1e1e' : '#161616';
                        ctx.fillRect(c * tileSize, r * tileSize, tileSize, tileSize);
                        ctx.strokeStyle = '#282828';
                        ctx.strokeRect(c * tileSize, r * tileSize, tileSize, tileSize);
                    }
                }

                // Highlight selected unit & legal moves (adjacent 1 square for infantry/tank barebones)
                if(selectedUnit && match.turn === myTeam) {
                    ctx.fillStyle = 'rgba(33, 150, 243, 0.3)';
                    ctx.fillRect(selectedUnit.x * tileSize, selectedUnit.y * tileSize, tileSize, tileSize);
                    
                    // Show basic movement neighbors
                    for(let dr=-1; dr<=1; dr++) {
                        for(let dc=-1; dc<=1; dc++) {
                            const nx = selectedUnit.x + dc;
                            const ny = selectedUnit.y + dr;
                            if(nx >=0 && nx < 8 && ny >= 0 && ny < 8) {
                                ctx.strokeStyle = '#2196F3';
                                ctx.strokeRect(nx * tileSize, ny * tileSize, tileSize, tileSize);
                            }
                        }
                    }
                }

                // Draw Units
                if(match.units) {
                    match.units.forEach(u => {
                        ctx.fillStyle = u.team === 'blue' ? '#2196F3' : '#ff5252';
                        ctx.beginPath();
                        ctx.arc(u.x * tileSize + tileSize/2, u.y * tileSize + tileSize/2, tileSize/3, 0, Math.PI*2);
                        ctx.fill();

                        // Label letter: T for Tank, I for Infantry
                        ctx.fillStyle = '#fff';
                        ctx.font = 'bold 12px sans-serif';
                        ctx.textAlign = 'center';
                        ctx.textBaseline = 'middle';
