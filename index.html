<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modern Chess Online - DevOnline</title>
    <style>
        :root {
            --bg-color: #121212;
            --surface-color: #1e1e1e;
            --surface-alt: #161616;
            --border-color: #333;
            --primary: #4CAF50;
            --secondary: #2196F3;
            --danger: #ff5252;
            --text-color: #ffffff;
            --text-muted: #888;
        }

        body {
            margin: 0;
            padding: 15px;
            background: var(--bg-color);
            color: var(--text-color);
            font-family: sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            min-height: 100vh;
            box-sizing: border-box;
        }

        .version-badge {
            position: fixed;
            top: 15px;
            right: 15px;
            background: #ff9800;
            color: #121212;
            font-size: 0.75rem;
            font-weight: bold;
            padding: 5px 10px;
            border-radius: 20px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.4);
            z-index: 1000;
        }

        .players-bar {
            width: 100%;
            max-width: 400px;
            background: var(--surface-color);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 10px;
            margin-bottom: 12px;
            box-sizing: border-box;
        }

        .players-bar-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            font-size: 0.8rem;
            font-weight: bold;
            margin-bottom: 6px;
        }

        .online-indicator {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .status-dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background-color: var(--danger);
            box-shadow: 0 0 6px var(--danger);
            transition: background-color 0.3s, box-shadow 0.3s;
        }

        .status-dot.active-multiple {
            background-color: var(--primary);
            box-shadow: 0 0 8px var(--primary);
        }

        .players-list {
            display: flex;
            flex-direction: column;
            gap: 4px;
            max-height: 90px;
            overflow-y: auto;
            border-top: 1px solid var(--border-color);
            padding-top: 6px;
        }

        .screen {
            display: none;
            width: 100%;
            max-width: 400px;
            flex-direction: column;
            align-items: center;
        }

        .screen.active {
            display: flex;
        }

        .card {
            background: var(--surface-color);
            padding: 25px;
            border-radius: 15px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.5);
            width: 100%;
            box-sizing: border-box;
            text-align: center;
            margin-bottom: 15px;
        }

        h2 { margin-top: 0; font-size: 1.3rem; margin-bottom: 15px; }

        .input-group {
            margin-bottom: 15px;
            text-align: left;
        }

        .input-group label {
            display: block;
            font-size: 0.8rem;
            color: var(--text-muted);
            margin-bottom: 5px;
        }

        .input-group input {
            width: 100%;
            padding: 10px;
            border-radius: 8px;
            border: 1px solid var(--border-color);
            background: #2a2a2a;
            color: #fff;
            box-sizing: border-box;
            font-size: 1rem;
            outline: none;
        }

        .btn {
            width: 100%;
            padding: 10px;
            background: var(--primary);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            margin-top: 5px;
        }

        .btn-secondary { background: var(--secondary); }
        .btn-danger { background: var(--danger); }

        .error-msg {
            color: var(--danger);
            font-size: 0.8rem;
            margin-top: 10px;
            min-height: 15px;
        }

        .accounts-box {
            background: var(--surface-alt);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            max-height: 120px;
            overflow-y: auto;
            margin-bottom: 15px;
            text-align: left;
            padding: 8px;
        }

        .accounts-title {
            font-size: 0.75rem;
            color: var(--text-muted);
            margin-bottom: 5px;
            text-transform: uppercase;
        }

        .account-item {
            font-size: 0.8rem;
            color: #b0bec5;
            padding: 2px 4px;
        }

        .server-list {
            background: var(--surface-alt);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            height: 150px;
            overflow-y: auto;
            margin-bottom: 10px;
            width: 100%;
            box-sizing: border-box;
            padding: 8px;
            text-align: left;
        }

        .global-chat-widget {
            width: 100%;
            max-width: 400px;
            background: var(--surface-color);
            border: 1px solid var(--border-color);
            border-radius: 10px;
            overflow: hidden;
            margin-bottom: 15px;
            box-sizing: border-box;
        }

        .global-chat-header {
            background: #252525;
            padding: 8px 12px;
            font-size: 0.85rem;
            font-weight: bold;
            color: var(--secondary);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .global-chat-body {
            height: 110px;
            overflow-y: auto;
            padding: 8px;
            display: flex;
            flex-direction: column;
            gap: 4px;
            background: var(--surface-alt);
        }

        .global-chat-input-area {
            display: flex;
            border-top: 1px solid var(--border-color);
            padding: 6px;
            background: var(--surface-color);
            gap: 6px;
        }

        .global-chat-input-area input {
            flex: 1;
            background: #2a2a2a;
            border: 1px solid var(--border-color);
            border-radius: 4px;
            padding: 4px 8px;
            color: #fff;
            font-size: 0.8rem;
            outline: none;
        }

        .global-chat-input-area button {
            padding: 4px 10px;
            font-size: 0.8rem;
            width: auto;
            margin: 0;
        }

        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 100%;
            margin-bottom: 10px;
        }

        #canvas-container {
            position: relative;
            width: 320px;
            height: 320px;
            background: #222;
            border: 2px solid var(--border-color);
            border-radius: 8px;
            overflow: hidden;
            margin-bottom: 15px;
        }

        canvas {
            display: block;
            background: #181818;
        }

        .status-banner {
            background: var(--surface-color);
            padding: 8px 12px;
            border-radius: 6px;
            font-size: 0.85rem;
            margin-bottom: 15px;
            width: 100%;
            box-sizing: border-box;
            text-align: center;
            font-weight: bold;
            color: #ffeb3b;
        }

        .chat-widget {
            width: 100%;
            background: var(--surface-color);
            border-radius: 10px;
            overflow: hidden;
            margin-bottom: 15px;
            box-sizing: border-box;
        }

        .chat-header {
            background: #252525;
            padding: 8px 12px;
            font-size: 0.85rem;
            font-weight: bold;
            color: var(--secondary);
            cursor: pointer;
            display: flex;
            justify-content: space-between;
        }

        .chat-body {
            max-height: 120px;
            overflow-y: auto;
            padding: 8px;
            display: flex;
            flex-direction: column;
            gap: 4px;
            background: var(--surface-alt);
        }

        .chat-input-area {
            display: flex;
            border-top: 1px solid var(--border-color);
            padding: 6px;
            background: var(--surface-color);
            gap: 6px;
        }

        .chat-input-area input {
            flex: 1;
            background: #2a2a2a;
            border: 1px solid var(--border-color);
            border-radius: 4px;
            padding: 4px 8px;
            color: #fff;
            font-size: 0.8rem;
            outline: none;
        }

        .chat-input-area button {
            padding: 4px 10px;
            font-size: 0.8rem;
            width: auto;
            margin: 0;
        }

        #console-container {
            width: 100%;
            max-width: 400px;
            background: #000;
            border: 1px solid #333;
            border-radius: 8px;
            margin-top: 10px;
            overflow: hidden;
            font-family: monospace;
            box-sizing: border-box;
        }
        .console-header {
            background: #1a1a1a;
            padding: 6px 10px;
            font-size: 0.75rem;
            color: #00ff66;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #333;
        }
        #console-logs {
            height: 90px;
            overflow-y: auto;
            padding: 6px;
            font-size: 0.7rem;
            color: #00ff66;
            text-align: left;
            line-height: 1.25;
            background: #080808;
        }
    </style>
</head>
<body>

    <div class="version-badge">devonline v1.9-single</div>

    <div class="players-bar" id="playersBar">
        <div class="players-bar-header">
            <div class="online-indicator">
                <div class="status-dot" id="statusDot"></div>
                <span id="onlineCountText">Active Players (0)</span>
            </div>
            <span style="color:var(--secondary); font-size:0.7rem;">Players List ▲</span>
        </div>
        <div class="players-list" id="playersListContainer">
            <div style="color:var(--text-muted); font-size:0.75rem; text-align:center;">No players online</div>
        </div>
    </div>

    <!-- 1. LOGIN SCREEN -->
    <div id="login-screen" class="screen active">
        <div class="card">
            <h2>Modern Chess Login</h2>
            <div class="accounts-box">
                <div class="accounts-title">Preset Accounts (Pass: 123)</div>
                <div class="account-item">player1 - player10</div>
            </div>
            <div class="input-group">
                <label>Username</label>
                <input type="text" id="userInput" placeholder="e.g. player1">
            </div>
            <div class="input-group">
                <label>Password</label>
                <input type="password" id="passInput" placeholder="e.g. 123">
            </div>
            <button class="btn" id="loginBtn">Login</button>
            <div class="error-msg" id="loginError"></div>
        </div>
    </div>

    <!-- 2. LOBBY SCREEN -->
    <div id="lobby-screen" class="screen">
        <div class="card">
            <div class="top-bar">
                <span id="welcomeUser" style="font-weight:bold; color:var(--primary);"></span>
                <button class="btn btn-danger" id="logoutBtn" style="width:auto; padding:4px 8px; font-size:0.75rem; margin:0;">Logout</button>
            </div>
            <h2>Server Lobby</h2>
            <button class="btn" id="createServerBtn">Create New Server</button>
            <button class="btn btn-danger" id="adminClearBtn" style="background:#d32f2f; margin-top:8px; font-size:0.85rem;">Admin: Clear All Matches & Data</button>

            <div style="margin: 10px 0 5px 0; font-size:0.75rem; color:var(--text-muted); text-align:left;">Available Servers:</div>
            <div class="server-list" id="serverList">
                <div style="color:var(--text-muted); font-size:0.8rem; text-align:center; margin-top:20px;">No servers active. Create one!</div>
            </div>
        </div>

        <div class="global-chat-widget">
            <div class="global-chat-header">
                <span>Universal Global Chat</span>
                <span style="font-size:0.7rem; color:var(--text-muted);">Lobby Public</span>
            </div>
            <div class="global-chat-body" id="globalChatMessages"></div>
            <div class="global-chat-input-area">
                <input type="text" id="globalChatInput" placeholder="Chat with everyone in lobby...">
                <button class="btn btn-secondary" id="globalChatSend">Send</button>
            </div>
        </div>
    </div>

    <!-- 3. GAME SCREEN -->
    <div id="game-screen" class="screen">
        <div class="top-bar">
            <span id="playerTeamBadge" style="font-weight:bold; font-size:0.85rem;">Match Arena</span>
            <button class="btn btn-danger" id="surrenderBtn" style="width:auto; padding:4px 8px; font-size:0.75rem; margin:0;">Leave Match</button>
        </div>
        
        <div class="status-banner" id="statusBanner">Match Active</div>

        <div id="canvas-container">
            <canvas id="gameCanvas" width="320" height="320"></canvas>
        </div>
    </div>

    <!-- Console Tracker -->
    <div id="console-container">
        <div class="console-header">
            <span>LIVE SYSTEM CONSOLE</span>
            <button id="clearConsole" style="background:none; border:none; color:#ff5252; cursor:pointer; font-size:0.7rem; font-weight:bold;">CLEAR</button>
        </div>
        <div id="console-logs"></div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getDatabase, ref, set, onValue, push, remove, update, get } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

        const consoleLogsEl = document.getElementById('console-logs');
        function logToScreen(type, args) {
            const line = document.createElement('div');
            line.textContent = `[${new Date().toLocaleTimeString()}] [${type.toUpperCase()}] ` + Array.from(args).map(arg => 
                typeof arg === 'object' ? JSON.stringify(arg) : arg
            ).join(' ');
            if(type === 'error') line.style.color = '#ff5252';
            consoleLogsEl.appendChild(line);
            consoleLogsEl.scrollTop = consoleLogsEl.scrollHeight;
        }
        console.log = function(...args) { logToScreen('log', args); };
        console.error = function(...args) { logToScreen('error', args); };
        document.getElementById('clearConsole').onclick = () => { consoleLogsEl.innerHTML = ''; };

        console.log("Initializing DevOnline Single-File App...");

        const firebaseConfig = {
            databaseURL: "https://mchess12333-default-rtdb.asia-southeast1.firebasedatabase.app/"
        };
        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);
        console.log("Firebase initialized.");

        let currentUser = localStorage.getItem('devOnlineUser') || null;

        function showScreen(id) {
            document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
            document.getElementById(id).classList.add('active');
        }

        document.getElementById('loginBtn').onclick = () => {
            const u = document.getElementById('userInput').value.trim();
            const p = document.getElementById('passInput').value.trim();
            const err = document.getElementById('loginError');
            if(!u || !p) { err.textContent = "Please fill in all fields."; return; }
            if(p !== "123") { err.textContent = "Incorrect password (use 123)."; return; }
            localStorage.setItem('devOnlineUser', u);
            currentUser = u;
            document.getElementById('welcomeUser').textContent = `User: ${u}`;
            showScreen('lobby-screen');
            console.log(`User logged in: ${u}`);
        };

        document.getElementById('logoutBtn').onclick = () => {
            localStorage.removeItem('devOnlineUser');
            currentUser = null;
            showScreen('login-screen');
            console.log("Logged out.");
        };

        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        function drawGrid() {
            ctx.fillStyle = '#181818';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            const size = canvas.width / 8;
            for(let r=0; r<8; r++) {
                for(let c=0; c<8; c++) {
                    ctx.fillStyle = (r+c)%2 === 0 ? '#262626' : '#1a1a1a';
                    ctx.fillRect(c*size, r*size, size, size);
                }
            }
        }
        drawGrid();

        document.getElementById('surrenderBtn').onclick = () => {
            showScreen('lobby-screen');
            console.log("Returned to lobby from game.");
        };

        if(currentUser) {
            document.getElementById('welcomeUser').textContent = `User: ${currentUser}`;
            showScreen('lobby-screen');
            console.log(`Restored session: ${currentUser}`);
        }
    </script>
</body>
</html>
